[package]
name = "cheby"
version = "0.1.0"
edition = "2021"
authors = ["VPRamon <vallespuigramon@gmail.com>"]
description = "Unit-safe Chebyshev approximation and spectral numerics for Rust."
license = "AGPL-3.0-only"
readme = "README.md"
repository = "https://github.com/Siderust/cheby"
keywords = ["chebyshev", "interpolation", "clenshaw", "numerics", "science"]
categories = ["science", "mathematics"]

[lib]
name = "cheby"

[features]
default = ["std", "approx", "calculus", "piecewise"]

std = ["qtty/std"]
alloc = ["qtty/alloc"]

approx = []
adaptive = ["approx", "alloc"]
minimax = ["approx", "alloc"]

calculus = []
piecewise = ["alloc"]

quadrature = []
spectral = ["calculus", "alloc"]

serde = ["dep:serde", "qtty/serde", "alloc"]
binary = ["alloc"]
fast-dct = ["dep:rustfft"]

full = [
    "std",
    "alloc",
    "approx",
    "adaptive",
    "minimax",
    "calculus",
    "piecewise",
    "quadrature",
    "spectral",
    "serde",
    "binary",
]

[dependencies]
qtty = { version = "0.6.1", default-features = false, features = ["cross-unit-ops"] }
serde = { version = "1.0", optional = true, features = ["derive"] }
rustfft = { version = "6.2", optional = true }

[dev-dependencies]
approx = "0.5"
criterion = "0.5"
proptest = "1.4"
trybuild = "1.0"

[[bench]]
name = "cheby"
harness = false
required-features = ["full"]

[[example]]
name = "adaptive_fit"
required-features = ["adaptive"]

[[example]]
name = "minimax_exp"
required-features = ["minimax"]

[[example]]
name = "clenshaw_curtis_integral"
required-features = ["quadrature"]

[[example]]
name = "spectral_differentiation"
required-features = ["spectral"]
